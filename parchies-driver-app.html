<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Parchies Driver"/>
  <meta name="theme-color" content="#0A1628"/>
  <title>Parchies Driver App</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#0F172A;font-family:'Inter',sans-serif;color:#1E293B;}
:root{
  --c-navy:#0A1628; --c-navy2:#0D1F3C; --c-cyan:#0284C7; --c-green:#2D7D0A;
  --c-amber:#B45309; --c-red:#C0321A; --c-text:#0F172A; --c-text2:#374151;
  --c-text3:#6B7280; --c-border:rgba(0,0,0,.1); --c-bg:#F1F5F9;
  --r:6px; --r2:10px; --r3:14px; --font:'Inter',sans-serif;
}
/* TOPBAR */
.d-topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:var(--c-navy);color:#fff;
  padding:max(12px,env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;gap:10px;
}
.d-topbar-title{font-size:16px;font-weight:800;flex:1;}
.d-topbar-sub{font-size:10px;color:rgba(255,255,255,.5);margin-top:1px;}
.d-status-dot{width:8px;height:8px;border-radius:50%;background:#2D7D0A;flex-shrink:0;}
/* BOTTOM NAV */
.d-bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:#fff;border-top:1px solid var(--c-border);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:max(8px,env(safe-area-inset-bottom));
}
.d-tab{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:10px 4px 6px;cursor:pointer;border:none;background:none;
  font-family:var(--font);transition:color .15s;color:var(--c-text3);
  font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;
}
.d-tab.active{color:var(--c-cyan);}
.d-tab-icon{font-size:20px;line-height:1;}
/* CONTENT AREA */
.d-content{
  position:fixed;top:0;left:0;right:0;bottom:0;
  padding-top:calc(56px + max(0px,env(safe-area-inset-top)));
  padding-bottom:calc(64px + max(0px,env(safe-area-inset-bottom)));
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:#EAECEF;
}
/* CARDS */
.d-card{background:#fff;border-radius:var(--r2);margin:10px 12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.d-card-header{padding:12px 14px;border-bottom:1px solid var(--c-border);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--c-text2);display:flex;align-items:center;gap:8px;}
.d-card-body{padding:14px;}
/* KPI ROW */
.d-kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 12px;}
.d-kpi{background:#fff;border-radius:var(--r2);padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.d-kpi-label{font-size:10px;font-weight:600;color:var(--c-text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
.d-kpi-val{font-size:22px;font-weight:800;color:var(--c-text);}
/* STATUS BUTTONS */
.d-status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.d-status-btn{padding:14px;border-radius:var(--r2);border:2px solid transparent;font-size:13px;font-weight:700;cursor:pointer;text-align:center;background:var(--c-bg);color:var(--c-text2);transition:all .15s;}
.d-status-btn.active-available{background:#DCFCE7;color:#166534;border-color:#86EFAC;}
.d-status-btn.active-loaded{background:#FEF9C3;color:#854D0E;border-color:#FDE68A;}
.d-status-btn.active-in-transit{background:#EFF9FF;color:#0369A1;border-color:#BAE6FD;}
.d-status-btn.active-home-time{background:#F3E8FF;color:#7E22CE;border-color:#D8B4FE;}
/* LOAD CARD */
.d-load-card{background:#fff;border-radius:var(--r2);margin:10px 12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);border-left:4px solid var(--c-cyan);}
.d-route{font-size:18px;font-weight:800;color:#0F172A;line-height:1.2;}
.d-route-arrow{color:var(--c-cyan);margin:0 6px;}
/* CHECKLIST */
.d-check-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #F1F5F9;}
.d-check-item:last-child{border-bottom:none;}
.d-check-box{width:24px;height:24px;border-radius:6px;border:2px solid #CBD5E1;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:pointer;}
.d-check-box.done{background:var(--c-green);border-color:var(--c-green);color:#fff;}
/* TIMELINE */
.d-timeline{display:flex;flex-direction:column;gap:0;}
.d-tl-item{display:flex;gap:12px;padding:10px 0;}
.d-tl-dot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex-shrink:0;}
.d-tl-line{width:2px;background:#E2E8F0;margin:0 auto;flex-grow:1;}
/* HOS BAR */
.d-hos-bar{height:12px;background:#E2E8F0;border-radius:99px;overflow:hidden;margin-top:6px;}
.d-hos-fill{height:100%;border-radius:99px;transition:width .5s;}
/* BUTTONS */
.d-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:var(--r2);border:none;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;width:100%;transition:opacity .15s;}
.d-btn:active{opacity:.8;}
.d-btn-primary{background:var(--c-cyan);color:#fff;}
.d-btn-green{background:var(--c-green);color:#fff;}
.d-btn-amber{background:#F59E0B;color:#fff;}
.d-btn-ghost{background:#F1F5F9;color:var(--c-text2);}
.d-btn-red{background:var(--c-red);color:#fff;}
/* BADGE */
.d-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;}
.d-badge-green{background:#DCFCE7;color:#166534;}
.d-badge-blue{background:#EFF9FF;color:#0369A1;}
.d-badge-amber{background:#FEF9C3;color:#854D0E;}
.d-badge-red{background:#FEE2E2;color:#991B1B;}
/* DVIR */
.d-dvir-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #F1F5F9;}
.d-dvir-checkbox{width:26px;height:26px;border-radius:6px;border:2px solid #CBD5E1;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.d-dvir-checkbox.checked{background:var(--c-green);border-color:var(--c-green);color:#fff;}
/* LOGIN */
.d-login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:30px 24px;background:linear-gradient(135deg,#0A1628 0%,#0D1F3C 100%);}
/* LIST */
.d-list-item{padding:14px;border-bottom:1px solid #F1F5F9;display:flex;align-items:center;gap:12px;cursor:pointer;}
.d-list-item:active{background:#F8FAFC;}
/* INPUT */
.d-input{width:100%;padding:14px;border:1.5px solid #E2E8F0;border-radius:var(--r2);font-family:var(--font);font-size:16px;outline:none;margin-bottom:12px;background:#fff;}
.d-input:focus{border-color:var(--c-cyan);}
/* SECTION LABEL */
.d-section{font-size:11px;font-weight:700;color:var(--c-text3);text-transform:uppercase;letter-spacing:.6px;padding:16px 14px 6px;}
/* TOAST */
.d-toast{position:fixed;top:max(70px,env(safe-area-inset-top)+70px);left:50%;transform:translateX(-50%);background:#0A1628;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;}
.d-toast.show{opacity:1;}
/* PULL TO REFRESH */
html{overscroll-behavior:none;}
body{overscroll-behavior:none;}

  /* Photo capture */
  .d-photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
  .d-photo-thumb{aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:#F1F5F9;border:1.5px solid #E2E8F0;position:relative;cursor:pointer;}
  .d-photo-thumb img{width:100%;height:100%;object-fit:cover;}
  .d-photo-thumb .d-photo-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .d-photo-add{aspect-ratio:1;border-radius:var(--r);border:2px dashed #CBD5E1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#F8FAFC;color:#94A3B8;font-size:11px;font-weight:600;gap:4px;}
  .d-photo-add span{font-size:28px;}
  /* Signature pad */
  .d-sig-canvas{width:100%;height:180px;border:1.5px solid #E2E8F0;border-radius:var(--r2);background:#fff;display:block;touch-action:none;cursor:crosshair;}
  .d-sig-canvas.signed{border-color:#2D7D0A;}
  /* Check call */
  .d-check-call-card{background:linear-gradient(135deg,#0A1628,#0D1F3C);border-radius:var(--r2);margin:0 12px 8px;padding:16px;color:#fff;}
  /* Photo modal */
  .d-photo-modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .d-photo-modal img{max-width:100%;max-height:80vh;border-radius:var(--r2);}

  /* DVIR media */
  .d-dvir-type-bar{display:grid;grid-template-columns:1fr 1fr;gap:0;border-radius:var(--r2);overflow:hidden;border:1.5px solid #E2E8F0;margin-bottom:12px;}
  .d-dvir-type-btn{padding:12px;text-align:center;font-size:13px;font-weight:700;cursor:pointer;background:#F8FAFC;color:var(--c-text3);border:none;font-family:var(--font);}
  .d-dvir-type-btn.active{background:#0A1628;color:#fff;}
  .d-dvir-media-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .d-dvir-media-thumb{width:60px;height:60px;border-radius:6px;overflow:hidden;position:relative;flex-shrink:0;cursor:pointer;}
  .d-dvir-media-thumb img,.d-dvir-media-thumb video{width:100%;height:100%;object-fit:cover;}
  .d-dvir-media-thumb .d-media-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .d-dvir-media-thumb .d-video-badge{position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.6);color:#fff;font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px;}
  .d-dvir-add-media{display:flex;gap:6px;margin-top:8px;}
  .d-dvir-add-btn{flex:1;padding:9px 6px;border:1.5px dashed #CBD5E1;border-radius:6px;background:#F8FAFC;color:#94A3B8;font-size:11px;font-weight:700;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .d-dvir-add-btn span{font-size:18px;}
  .d-dvir-item-expanded{background:#FFFBEB;border-radius:6px;padding:8px;margin-top:6px;border:1px solid #FDE68A;}
  .d-progress-bar{height:6px;background:#E2E8F0;border-radius:99px;overflow:hidden;margin:8px 0;}
  .d-progress-fill{height:100%;border-radius:99px;transition:width .3s;}

  /* Push notification banner */
  .d-notif-banner{
    position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;
    transform:translateX(-50%) translateY(-120%);
    background:#0A1628;color:#fff;border:1px solid rgba(2,132,199,.4);
    border-radius:14px;padding:14px 16px;z-index:9999;
    display:flex;align-items:flex-start;gap:12px;
    box-shadow:0 8px 32px rgba(0,0,0,.5);
    max-width:340px;width:calc(100vw - 32px);
    transition:transform .35s cubic-bezier(.34,1.56,.64,1);
    font-family:-apple-system,Inter,sans-serif;
  }
  .d-notif-banner.show{transform:translateX(-50%) translateY(0);}
  .d-notif-icon{font-size:26px;flex-shrink:0;margin-top:1px;}
  .d-notif-body{flex:1;min-width:0;}
  .d-notif-title{font-size:13px;font-weight:800;margin-bottom:3px;}
  .d-notif-msg{font-size:12px;color:rgba(255,255,255,.7);line-height:1.4;}
  .d-notif-actions{display:flex;gap:8px;margin-top:10px;}
  .d-notif-btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:inherit;}
  .d-notif-accept{background:#2D7D0A;color:#fff;}
  .d-notif-view{background:#0284C7;color:#fff;}
  .d-notif-dismiss{background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);}
  /* Notification permission prompt */
  .d-perm-bar{
    position:fixed;bottom:calc(64px + max(0px,env(safe-area-inset-bottom)));
    left:12px;right:12px;background:#0A1628;color:#fff;
    border:1px solid rgba(2,132,199,.3);border-radius:12px;
    padding:14px;z-index:200;display:flex;align-items:center;gap:12px;
    font-family:-apple-system,Inter,sans-serif;
  }
  /* Bell icon on topbar */
  .d-notif-bell{
    position:relative;background:rgba(255,255,255,.08);
    border:none;border-radius:8px;color:#fff;width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;cursor:pointer;flex-shrink:0;
  }
  .d-notif-bell .d-bell-badge{
    position:absolute;top:-4px;right:-4px;background:#C0321A;
    color:#fff;font-size:8px;font-weight:800;border-radius:99px;
    min-width:14px;height:14px;display:flex;align-items:center;
    justify-content:center;padding:0 3px;border:1.5px solid #0A1628;
  }

  /* Weather card */
  .d-weather-hero{background:linear-gradient(135deg,#0A1628,#0D2B4E);border-radius:var(--r2);margin:10px 12px;padding:20px;color:#fff;overflow:hidden;position:relative;}
  .d-weather-temp{font-size:64px;font-weight:900;line-height:1;color:#fff;}
  .d-weather-row{display:flex;gap:8px;margin:10px 12px 0;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .d-weather-row::-webkit-scrollbar{display:none;}
  .d-weather-day{background:#fff;border-radius:var(--r2);padding:12px 10px;text-align:center;flex-shrink:0;width:80px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .d-weather-alert{background:#FEF9C3;border:1px solid #FDE68A;border-radius:var(--r2);margin:8px 12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;}
  /* Fuel finder */
  .d-fuel-stop{background:#fff;border-radius:var(--r2);margin:6px 12px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;align-items:center;gap:12px;}
  .d-fuel-price{font-size:22px;font-weight:900;color:#0284C7;flex-shrink:0;width:60px;text-align:right;}
  .d-fuel-badge{display:inline-flex;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;}
  .d-fuel-network{background:#EFF9FF;color:#0369A1;}
  .d-fuel-cheap{background:#DCFCE7;color:#166534;}
  /* Chat */
  .d-chat-bubble{max-width:80%;border-radius:18px;padding:10px 14px;font-size:14px;line-height:1.4;margin-bottom:2px;}
  .d-chat-mine{background:#0284C7;color:#fff;border-bottom-right-radius:4px;align-self:flex-end;}
  .d-chat-theirs{background:#fff;color:var(--c-text);border-bottom-left-radius:4px;align-self:flex-start;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .d-chat-time{font-size:10px;color:var(--c-text3);margin:0 4px 8px;}
  .d-chat-messages{display:flex;flex-direction:column;padding:10px 14px;gap:4px;}
  .d-chat-input-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--c-border);padding:10px 12px;display:flex;gap:8px;align-items:flex-end;}
  /* Reminders */
  .d-remind-item{background:#fff;border-radius:var(--r2);margin:6px 12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .d-remind-bar{height:4px;}
  .d-remind-body{padding:12px 14px;}
  /* Tool nav pills */
  .d-tool-pills{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .d-tool-pills::-webkit-scrollbar{display:none;}
  .d-tool-pill{flex-shrink:0;padding:8px 16px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:var(--font);transition:all .15s;}
  .d-tool-pill.active{background:#0A1628;color:#fff;}
  .d-tool-pill:not(.active){background:#fff;color:var(--c-text2);border:1px solid #E2E8F0;}
</style>
</head>
<body>
<div class="d-toast" id="d-toast"></div>

<div id="d-app">
  <!-- Login Screen -->
  <div id="d-login" class="d-login">
    <div style="margin-bottom:32px;text-align:center">
      <div style="font-size:64px;margin-bottom:12px">🚛</div>
      <div style="font-size:24px;font-weight:800;color:#fff">Parchies Enterprises</div>
      <div style="font-size:13px;color:rgba(255,255,255,.5);margin-top:4px">Driver App</div>
    </div>
    <div style="width:100%;max-width:360px">
      <select id="d-driver-select" class="d-input" style="background:#fff">
        <option value="">👇 Tap to choose your name...</option>
      </select>
      <input type="password" id="d-pin" class="d-input" placeholder="Enter PIN (use 0000)" maxlength="6" inputmode="numeric"/>
      <button class="d-btn d-btn-primary" onclick="driverLogin()" style="margin-top:4px">Sign In →</button>
      <div style="background:rgba(255,255,255,.07);border-radius:10px;padding:14px;margin-top:16px;text-align:left">
  <div style="font-size:12px;font-weight:700;color:rgba(255,255,255,.7);margin-bottom:8px">🔑 How to Sign In</div>
  <div style="font-size:12px;color:rgba(255,255,255,.5);line-height:1.8">
    1. Select your name from the list<br>
    2. Enter PIN: <strong style="color:rgba(255,255,255,.8)">0000</strong><br>
    3. Tap Sign In
  </div>
</div>
<div style="text-align:center;color:rgba(255,255,255,.2);font-size:10px;margin-top:12px">Parchies Enterprises LLC · Driver App</div>
    </div>
  </div>

  <!-- Main App (hidden until login) -->
  <div id="d-main" style="display:none">
    <!-- Topbar -->
    <div class="d-topbar">
      <div class="d-status-dot" id="d-status-dot"></div>
      <div style="flex:1">
        <div class="d-topbar-title" id="d-driver-name">Driver</div>
        <div class="d-topbar-sub" id="d-driver-unit">Loading...</div>
      </div>
      <div id="d-topbar-badge" style="font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.8)"></div>
      <button class="d-notif-bell" onclick="openNotifHistory()" id="d-bell-btn" title="Notifications">
        🔔<span class="d-bell-badge" id="d-bell-count" style="display:none">0</span>
      </button>
    </div>

    <!-- Content -->
    <div class="d-content" id="d-content"></div>

    <!-- Bottom Nav -->
    <div class="d-bottomnav">
      <button class="d-tab active" onclick="showScreen('home')" id="tab-home">
        <span class="d-tab-icon">🏠</span>Home
      </button>
      <button class="d-tab" onclick="showScreen('load')" id="tab-load">
        <span class="d-tab-icon">📦</span>My Load
      </button>
      <button class="d-tab" onclick="showScreen('dvir')" id="tab-dvir">
        <span class="d-tab-icon">✅</span>DVIR
      </button>
      <button class="d-tab" onclick="showScreen('history')" id="tab-history">
        <span class="d-tab-icon">📋</span>History
      </button>
      <button class="d-tab" onclick="showScreen('tools')" id="tab-tools">
        <span class="d-tab-icon">🛠</span>Tools
      </button>
    </div>
  </div>
</div>

<script>

// ─── DRIVER APP CORE ─────────────────────────────────────────
// Inlined from full TMS — driver-specific data only

// Pull DB from localStorage (shared with office app if on same device)
let DB = {drivers:[],loads:[],tractors:[],fuel:[],dvirRecords:[],hos:[],settlements:[],driverChecklist:{}};
let dApp = { driverId: null, screen: 'home', dvirChecks: {} };

// Load data from localStorage
function loadData(){
  // ── Step 1: Try to read live office DB (same browser, same device) ──
  let usedOfficeDB = false;
  try {
    const officeRaw = localStorage.getItem('parchies_tms_db');
    if(officeRaw){
      const officeDB = JSON.parse(officeRaw);
      // Load all relevant collections from office DB
      if(officeDB.drivers     && officeDB.drivers.length)     DB.drivers     = officeDB.drivers;
      if(officeDB.loads       && officeDB.loads.length)       DB.loads       = officeDB.loads;
      if(officeDB.settlements && officeDB.settlements.length) DB.settlements = officeDB.settlements;
      if(officeDB.dvirRecords && officeDB.dvirRecords.length) DB.dvirRecords = officeDB.dvirRecords;
      if(officeDB.hos         && officeDB.hos.length)         DB.hos         = officeDB.hos;
      if(officeDB.tractors)    DB.tractors    = officeDB.tractors;
      if(officeDB.fuel)        DB.fuel        = officeDB.fuel;
      if(officeDB.schedule)    DB.schedule    = officeDB.schedule;
      DB.driverChecklist = officeDB.driverChecklist || {};
      usedOfficeDB = true;
    }
  } catch(e){ }

  // ── Step 2: Fall back to embedded data if office DB not available ──
  if(!usedOfficeDB){
    DB.drivers     = EMBEDDED_DRIVERS.map(d=>({...d}));
    DB.loads       = EMBEDDED_LOADS.map(l=>({...l}));
    DB.settlements = EMBEDDED_SETTS.map(s=>({...s}));
    DB.dvirRecords = EMBEDDED_DVIR.map(r=>({...r}));
    DB.hos         = EMBEDDED_HOS.map(h=>({...h}));
    DB.driverChecklist = {};
  }

  // ── Step 3: Apply driver-side deltas (actions taken in driver app) ──
  try {
    const saved = localStorage.getItem('parchies-driver-db');
    if(saved){
      const delta = JSON.parse(saved);
      // Merge load status changes (deliveries, POD updates)
      if(delta.loads) delta.loads.forEach(dl=>{
        const existing = DB.loads.find(l=>l.id===dl.id);
        if(existing) Object.assign(existing, dl);
        else DB.loads.push(dl);
      });
      // Merge driver status changes (Available/In Transit/etc)
      if(delta.drivers) delta.drivers.forEach(dd=>{
        const existing = DB.drivers.find(d=>d.id===dd.id);
        if(existing) Object.assign(existing, dd);
      });
      // Merge new DVIR records submitted by driver
      if(delta.newDvir) delta.newDvir.forEach(r=>{
        if(!DB.dvirRecords.find(x=>x.id===r.id)) DB.dvirRecords.unshift(r);
      });
      if(delta.driverChecklist) DB.driverChecklist = delta.driverChecklist;
      if(delta.photos)          dApp.photos        = delta.photos;
      if(delta.signatures)      dApp.signatures    = delta.signatures;
      if(delta.checkCalls)      dApp.checkCalls    = delta.checkCalls;
      if(delta.photoTag)        dApp.photoTag      = delta.photoTag;
      if(delta.dvirMedia)       dApp.dvirMedia     = delta.dvirMedia;
      if(delta.dvirNotes)       dApp.dvirNotes     = delta.dvirNotes;
      if(delta.dvirType)        dApp.dvirType      = delta.dvirType;
      if(delta.chatMessages)    dApp.chatMessages  = delta.chatMessages;
      if(delta.toolTab)         dApp.toolTab       = delta.toolTab;
      if(delta.fuelSearchCity)  dApp.fuelSearchCity= delta.fuelSearchCity;
    }
  } catch(e){ }

  // ── Populate driver select on login screen ──
  const sel = document.getElementById('d-driver-select');
  if(sel){
    while(sel.options.length > 1) sel.remove(1);
    DB.drivers.forEach(d=>{
      const opt = document.createElement('option');
      opt.value = d.id; opt.textContent = d.name;
      sel.appendChild(opt);
    });
  }
}

// Toast notification
function toast(msg, dur=2500){
  const el=document.getElementById('d-toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),dur);
}

// Login
function driverLogin(){
  const id=document.getElementById('d-driver-select').value;
  const pin=document.getElementById('d-pin').value;
  if(!id){ toast('Select your name'); return; }
  const driver=DB.drivers.find(d=>d.id===id);
  if(!driver){ toast('Driver not found'); return; }
  // PIN check: any 4-digit or blank = 0000 for demo
  if(pin&&pin!=='0000'&&pin!==driver.pin){ toast('Incorrect PIN'); return; }
  dApp.driverId=id;
  document.getElementById('d-login').style.display='none';
  document.getElementById('d-main').style.display='block';
  updateTopbar();
  showScreen('home');
  toast('Welcome, '+driver.name.split(' ')[0]+'! 👋');
  // Start notification system
  initNotifications();
}

// Current driver
function me(){ return DB.drivers.find(d=>d.id===dApp.driverId)||{}; }
function myLoads(){ return (DB.loads||[]).filter(l=>l.driverId===dApp.driverId); }
function activeLoad(){ return myLoads().find(l=>['In Transit','Loaded'].includes(l.status)); }

// Helpers
function fmtUSD(n){ return '$'+(+n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function fmtNum(n){ return (+n||0).toLocaleString(); }
function fmtDate(s){ if(!s)return'—'; try{ const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'}); }catch(e){ return s; } }
function daysUntil(s){ if(!s)return null; const d=(new Date(s+'T00:00:00')-new Date())/(1000*60*60*24); return Math.ceil(d); }

// Gross pay calc
function myPay(l){
  const d=me();
  const rate=(d.payRate||28)/100;
  const base=((l.gross||0)+(l.fsc||0))*rate;
  return Math.round(base);
}

// YTD stats
function ytd(){
  const loads=myLoads().filter(l=>l.status==='Delivered'||l.status==='Paid');
  const year=new Date().getFullYear().toString();
  const yearLoads=loads.filter(l=>(l.date||'').startsWith(year));
  return {
    loads: yearLoads.length,
    miles: yearLoads.reduce((s,l)=>s+(l.miles||0),0),
    gross: yearLoads.reduce((s,l)=>s+(l.gross||0)+(l.fsc||0),0),
    pay:   yearLoads.reduce((s,l)=>s+myPay(l),0),
  };
}

// Save data
function saveData(){
  try{
    // ── Save driver-side delta (fast, small) ──
    const delta = {
      loads: DB.loads.filter(l=>{
        const orig = EMBEDDED_LOADS.find(x=>x.id===l.id);
        return !orig || l.status!==orig.status || l.podStatus!==orig.podStatus ||
               l.actualDeliveryTime!==orig.actualDeliveryTime || l.actualPickupTime!==orig.actualPickupTime;
      }),
      drivers: DB.drivers.filter(d=>{
        const orig = EMBEDDED_DRIVERS.find(x=>x.id===d.id);
        return !orig || d.dispatchStatus!==orig.dispatchStatus;
      }),
      newDvir: DB.dvirRecords.filter(r=>r.id.startsWith('DVIR-')),
      driverChecklist: DB.driverChecklist,
      photos:         dApp.photos         || {},
      signatures:     dApp.signatures     || {},
      checkCalls:     dApp.checkCalls     || {},
      photoTag:       dApp.photoTag       || 'BOL',
      dvirMedia:      dApp.dvirMedia      || {},
      dvirNotes:      dApp.dvirNotes      || {},
      dvirType:       dApp.dvirType       || 'pre',
      chatMessages:   dApp.chatMessages   || [],
      toolTab:        dApp.toolTab        || 'weather',
      fuelSearchCity: dApp.fuelSearchCity || '',
    };
    localStorage.setItem('parchies-driver-db', JSON.stringify(delta));

    // ── Also write critical changes back to office DB ──
    // This ensures office sees load status changes, driver status, DVIRs
    try {
      const officeRaw = localStorage.getItem('parchies_tms_db');
      if(officeRaw){
        const officeDB = JSON.parse(officeRaw);
        let changed = false;

        // Sync load status changes (mark delivered, POD updates)
        delta.loads.forEach(dl => {
          const idx = (officeDB.loads||[]).findIndex(l=>l.id===dl.id);
          if(idx > -1){
            Object.assign(officeDB.loads[idx], dl);
            changed = true;
          }
        });

        // Sync driver dispatch status
        delta.drivers.forEach(dd => {
          const idx = (officeDB.drivers||[]).findIndex(d=>d.id===dd.id);
          if(idx > -1){
            officeDB.drivers[idx].dispatchStatus = dd.dispatchStatus;
            changed = true;
          }
        });

        // Sync new DVIRs submitted by driver
        delta.newDvir.forEach(r => {
          if(!(officeDB.dvirRecords||[]).find(x=>x.id===r.id)){
            if(!officeDB.dvirRecords) officeDB.dvirRecords = [];
            officeDB.dvirRecords.unshift(r);
            changed = true;
          }
        });

        if(changed){
          localStorage.setItem('parchies_tms_db', JSON.stringify(officeDB));
        }
      }
    } catch(e){ }

  }catch(e){ }
}

function updateTopbar(){
  const d=me();
  const al=activeLoad();
  document.getElementById('d-driver-name').textContent=d.name||'Driver';
  document.getElementById('d-driver-unit').textContent=(d.tractor||'No unit')+' · '+(d.dispatchStatus||'Off Duty');
  const dot=document.getElementById('d-status-dot');

function showScreen(screen){
  dApp.screen=screen;
  // Update tab states
  ['home','load','dvir','history','me'].forEach(t=>{
    const tab=document.getElementById('tab-'+t);
    if(tab) tab.classList.toggle('active', t===screen);
  });
  const content=document.getElementById('d-content');
  content.scrollTop=0;
  switch(screen){
    case 'home':    content.innerHTML=renderHome();    break;
    case 'load':    content.innerHTML=renderLoad();    break;
    case 'dvir':    content.innerHTML=renderDVIR();    break;
    case 'history': content.innerHTML=renderHistory(); break;
    case 'me':      content.innerHTML=renderMe();      break;
    case 'tools':   content.innerHTML=renderTools();   break;
  }
  updateTopbar();
}

function renderComplianceAlerts(){
  const d=me();
  const alerts=[];
  const cdlDays=daysUntil(d.cdlExpiry);
  const medDays=daysUntil(d.medExpiry||d.medCardExpiry);
  if(cdlDays!==null&&cdlDays<=30) alerts.push({icon:'📋',text:'CDL expires in '+cdlDays+'d',color:'#FEF9C3',tc:'#854D0E'});
  if(medDays!==null&&medDays<=30) alerts.push({icon:'🏥',text:'Med Card expires in '+medDays+'d',color:'#FEE2E2',tc:'#991B1B'});
  if(!alerts.length) return '';
  return `<div style="margin:0 12px 8px">
    ${alerts.map(a=>`<div style="background:${a.color};border-radius:var(--r2);padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px">

}

function generateWeatherData(loc, load){
  // Realistic weather simulation based on location/season
  const city = (loc||'Atlanta').split(',')[0];
  const month = new Date().getMonth();
  const isSummer = month >= 5 && month <= 8;
  const isWinter = month <= 1 || month === 11;
  const baseTemp = isSummer ? 85 : isWinter ? 42 : 65;
  const conditions = isSummer
    ? ['Sunny','Partly Cloudy','Thunderstorm','Clear','Humid','Partly Cloudy']
    : isWinter
    ? ['Cloudy','Partly Cloudy','Clear','Rain','Foggy','Windy']
    : ['Clear','Partly Cloudy','Sunny','Windy','Cloudy'];
  const cond = conditions[Math.floor(Math.random()*conditions.length)];
  const temp = baseTemp + Math.round((Math.random()-0.5)*20);
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const today = new Date().getDay();
  const data = {
    current:{
      location: city,
      temp, feelsLike: temp-3, high: temp+8, low: temp-10,
      condition: cond, wind: 5+Math.round(Math.random()*20),
      humidity: 40+Math.round(Math.random()*40),
    },
    forecast: Array.from({length:5},(_,i)=>({
      day: days[(today+i+1)%7],
      condition: conditions[Math.floor(Math.random()*conditions.length)],
      high: temp+Math.round((Math.random()-0.3)*15),
      low:  temp-10+Math.round((Math.random()-0.5)*10),
      precip: Math.random()>.6?Math.round(Math.random()*80):0,
    })),
    alerts: isSummer && Math.random()>.6
      ? [{title:'Heat Advisory',detail:'High temps expected 95-100°F. Stay hydrated. Limit physical activity 10AM-6PM.'}]
      : isWinter && Math.random()>.7
      ? [{title:'Winter Weather Advisory',detail:'Possible ice on bridges and overpasses. Reduce speed, increase following distance.'}]
      : [],
  };
  dApp.weatherCache = data;
  dApp.weatherLoc   = loc;
  return data;
}

function generateCityWeather(city){
  const month = new Date().getMonth();
  const isSummer = month >= 5 && month <= 8;
  const temp = (isSummer?82:48)+Math.round((Math.random()-0.5)*20);
  const conds = isSummer?['Sunny','Partly Cloudy','Thunderstorm']:['Cloudy','Rain','Partly Cloudy'];
  return {temp, condition:conds[Math.floor(Math.random()*conds.length)], wind:5+Math.round(Math.random()*20)};
}

}

function sendChatMessage(){
  const inp = document.getElementById('d-chat-input');
  const text = inp?.value?.trim();
  if(!text) return;
  if(!dApp.chatMessages) dApp.chatMessages = [];
  const msg = {
    id: Date.now(),
    from: 'driver',
    text,
    time: new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),
    driverId: dApp.driverId,
    driverName: me().name,
  };
  dApp.chatMessages.push(msg);
  saveData();
  // Write to shared localStorage so office app can read it
  try {
    const key = 'parchies-driver-chat-'+dApp.driverId;
    const existing = JSON.parse(localStorage.getItem(key)||'[]');
    existing.push(msg);
    localStorage.setItem(key, JSON.stringify(existing.slice(-100)));
  } catch(e){}
  // BroadcastChannel to office app
  if('BroadcastChannel' in window){
    const bc = new BroadcastChannel('parchies-chat');
    bc.postMessage({type:'driver-message', msg});
    bc.close();
  }
  if(inp) inp.value='';
  showScreen('tools');
  // Auto-scroll to bottom
  setTimeout(()=>{
    const scroll = document.getElementById('d-chat-scroll');
    if(scroll) scroll.scrollTop = scroll.scrollHeight;
  }, 100);
  toast('✅ Message sent to dispatch');
}

// Poll for dispatch replies
function pollForChatReplies(){
  if(!dApp.driverId) return;
  try {
    const key = 'parchies-dispatch-chat-'+dApp.driverId;
    const replies = JSON.parse(localStorage.getItem(key)||'[]');
    if(!dApp.chatMessages) dApp.chatMessages = [];
    const existingIds = new Set(dApp.chatMessages.map(m=>m.id));
    const newReplies = replies.filter(r=>!existingIds.has(r.id));
    if(newReplies.length > 0){
      newReplies.forEach(r => dApp.chatMessages.push(r));
      saveData();
      triggerNotification('💬 Dispatch replied', newReplies[newReplies.length-1].text.slice(0,60), {type:'message'});
      if(dApp.toolTab==='chat') showScreen('tools');
    }
  } catch(e){}
}

function renderReminders(){
  const d = me();
  const cdlDays = daysUntil(d.cdlExpiry);
  const medDays = daysUntil(d.medExpiry||d.medCardExpiry);
  const now = new Date();

  // Build all reminders
  const reminders = [];

  // CDL Expiry
  if(d.cdlExpiry){
    const urgent = cdlDays !== null && cdlDays <= 30;
    const warning= cdlDays !== null && cdlDays <= 90;
    reminders.push({
      icon:'📋', title:'CDL Renewal',
      detail:`CDL expires ${fmtDate(d.cdlExpiry)}${cdlDays!==null?' ('+cdlDays+' days)':''}`,
      sub: urgent?'⚠️ RENEW IMMEDIATELY — contact DMV today'
           :warning?'Schedule CDL renewal — allow 2-3 weeks'
           :'CDL current — no action needed',
      color: urgent?'#C0321A':warning?'#B45309':'#2D7D0A',
      barColor: urgent?'#C0321A':warning?'#F59E0B':'#2D7D0A',
      urgent,
      action: urgent||warning ? `<a href="tel:8005554636" style="display:block;margin-top:8px;background:#0284C7;color:#fff;text-decoration:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;text-align:center">📞 Call DMV</a>` : '',
    });
  }

  // Medical Certificate
  if(d.medExpiry||d.medCardExpiry){
    const exp = d.medExpiry||d.medCardExpiry;
    const days = daysUntil(exp);
    const urgent = days!==null&&days<=30;
    const warning= days!==null&&days<=60;
    reminders.push({
      icon:'🏥', title:'DOT Medical Certificate',
      detail:`Med cert expires ${fmtDate(exp)}${days!==null?' ('+days+' days)':''}`,
      sub: urgent?'⚠️ EXPIRED or EXPIRING — schedule physical immediately'
           :warning?'Schedule DOT physical soon — requires 4-6 weeks'
           :'Medical certificate current',
      color: urgent?'#C0321A':warning?'#B45309':'#2D7D0A',
      barColor: urgent?'#C0321A':warning?'#F59E0B':'#2D7D0A',
      urgent,
      action: urgent||warning ? `<button onclick="findDOTPhysician()" style="margin-top:8px;background:#0284C7;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font)">🔍 Find DOT Physician</button>` : '',
    });
  }

  // Random drug test (simulated schedule)
  const nextDrugTest = d.nextDrugTest;
  if(nextDrugTest){
    const days = daysUntil(nextDrugTest);
    const urgent = days!==null&&days<=7;
    reminders.push({
      icon:'🧪', title:'Random Drug Test',
      detail:`Next scheduled: ${fmtDate(nextDrugTest)}${days!==null?' ('+days+' days)':''}`,
      sub: urgent?'⚠️ Drug test due this week — contact HR'
           :'Random pool — you may be selected at any time',
      color: urgent?'#C0321A':'#0284C7',
      barColor: urgent?'#C0321A':'#0284C7',

    });
  }

  // Annual driving record review
  const hireDate = d.hireDate ? new Date(d.hireDate+'T00:00:00') : null;
  if(hireDate){
    const anniversary = new Date(now.getFullYear(), hireDate.getMonth(), hireDate.getDate());
    if(anniversary < now) anniversary.setFullYear(now.getFullYear()+1);
    const aDays = Math.ceil((anniversary-now)/(1000*60*60*24));
    reminders.push({
      icon:'📅', title:'Annual Record Review',
      detail:`Next review: ${anniversary.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})} (${aDays}d)`,
      sub:'DOT requires annual review of driving record and violations',
      color:'#0284C7', barColor:'#0284C7', urgent:aDays<=30,
      action:'',
    });
  }

  // Hazmat (if applicable)
  if(d.hazmat==='Yes'&&d.hazmatExpiry){
    const days=daysUntil(d.hazmatExpiry);
    const urgent=days!==null&&days<=60;
    reminders.push({
      icon:'☢️', title:'HAZMAT Endorsement',
      detail:`Expires ${fmtDate(d.hazmatExpiry)}${days!==null?' ('+days+' days)':''}`,
      sub:urgent?'⚠️ Schedule HAZMAT renewal — TSA clearance takes 4-8 weeks':'HAZMAT endorsement current',
      color:urgent?'#C0321A':'#2D7D0A', barColor:urgent?'#C0321A':'#2D7D0A', urgent,

  if(d.twicExpiry){

      action:'',
    });
  }

  // Sort: urgent first
  reminders.sort((a,b)=>(b.urgent?1:0)-(a.urgent?1:0));

  return `
    ${reminders.length===0?`<div style="text-align:center;padding:40px 20px;color:var(--c-text3)">
      <div style="font-size:40px;margin-bottom:10px">✅</div>

          </div>

          ${r.action}
        </div>
      </div>`).join('')}

    <!-- HOS Summary -->
    <div class="d-section">Hours of Service</div>
    ${(()=>{
      const hos=(DB.hos||[]).find(h=>h.driverId===dApp.driverId);
      if(!hos) return '<div class="d-card"><div class="d-card-body" style="text-align:center;color:var(--c-text3);font-size:13px">No HOS data — connect ELD</div></div>';
      const used=hos.cycleUsed||0; const avail=hos.cycleAvail||0;

        <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px">

function capturePhoto(event, loadId){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    if(!dApp.photos[loadId]) dApp.photos[loadId] = [];
    // Compress image before storing
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 800;
      let w = img.width, h = img.height;
      if(w > MAX){ h = Math.round(h * MAX/w); w = MAX; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const compressed = canvas.toDataURL('image/jpeg', 0.7);
      dApp.photos[loadId].push({
        data: compressed,
        tag:  dApp.photoTag,
        time: new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),
        date: new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'}),
        loadId,
      });
      saveData();
      toast('📷 ' + dApp.photoTag + ' photo saved');
      showScreen('load');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  event.target.value = ''; // reset input so same file can be re-selected
}

function buildCheckCallMsg(load){
  const d = me();
  const now = new Date();
  const time = now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  const origin = (load.origin||'').split(',')[0];
  const dest   = (load.dest||'').split(',')[0];

function sendCheckCall(loadId, method){
  const load = DB.loads.find(l=>l.id===loadId);
  if(!load) return;
  const msg = buildCheckCallMsg(load);
  const dispatchPhone = DB.settings?.dispatchPhone || '7065550100';
  const dispatchEmail = DB.settings?.dispatchEmail || 'parchiestruck@gmail.com';

  if(method === 'sms'){
    window.location.href = `sms:${dispatchPhone}?body=${encodeURIComponent(msg)}`;
  } else {
    const subject = `Check Call — ${me().name} — Load ${loadId}`;
    window.location.href = `mailto:${dispatchEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(msg)}`;
  }
  // Log the check call
  if(!dApp.checkCalls) dApp.checkCalls = {};
  if(!dApp.checkCalls[loadId]) dApp.checkCalls[loadId] = [];
  dApp.checkCalls[loadId].push({
    time: new Date().toISOString(),
    method,
    msg,
  });
  saveData();
  toast('✅ Check call sent via ' + (method==='sms'?'text':'email'));
}

// #4 — ELECTRONIC SIGNATURE
// ════════════════════════════════════════════════════════════
let _sigDrawing = false;
let _sigCtx     = null;
let _sigCanvas  = null;
let _sigHasData = false;

function initSigCanvas(loadId){
  const canvas = document.getElementById('d-sig-' + loadId);
  if(!canvas || dApp.signatures[loadId]) return;

  // Scale for device pixel ratio (sharp on retina)
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width  = rect.width  + 'px';
  canvas.style.height = rect.height + 'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0F172A';
  ctx.lineWidth   = 2.5;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  _sigCanvas = canvas;
  _sigCtx    = ctx;
  _sigHasData = false;

  function getPos(e){
    const r = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x: src.clientX - r.left, y: src.clientY - r.top };
  }

  canvas.addEventListener('touchstart', e=>{
    e.preventDefault();
    _sigDrawing = true;
    const p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  }, {passive:false});

  canvas.addEventListener('touchmove', e=>{
    e.preventDefault();
    if(!_sigDrawing) return;
    const p = getPos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    _sigHasData = true;
  }, {passive:false});

  canvas.addEventListener('touchend', e=>{
    e.preventDefault();
    _sigDrawing = false;
    ctx.beginPath();
  }, {passive:false});

  // Mouse fallback for desktop testing
  canvas.addEventListener('mousedown', e=>{
    _sigDrawing = true;
    const p = getPos(e);
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
  });
  canvas.addEventListener('mousemove', e=>{
    if(!_sigDrawing) return;
    const p = getPos(e);
    ctx.lineTo(p.x, p.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
    _sigHasData = true;
  });
  canvas.addEventListener('mouseup',   ()=>{ _sigDrawing=false; ctx.beginPath(); });
  canvas.addEventListener('mouseleave',()=>{ _sigDrawing=false; });
}

function clearCanvas(loadId){
  const canvas = document.getElementById('d-sig-' + loadId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  _sigHasData = false;
}

function saveSignature(loadId){
  const canvas = document.getElementById('d-sig-' + loadId);
  if(!canvas){ toast('Signature canvas not found'); return; }
  if(!_sigHasData){ toast('Please draw your signature first'); return; }

  const d = me();
  const now = new Date();
  dApp.signatures[loadId] = {
    data: canvas.toDataURL('image/png'),
    name: d.name,
    driverId: d.id,
    loadId,
    time: now.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}),
    timestamp: now.toISOString(),
  };
  saveData();
  toast('✅ Signature saved for Load ' + loadId);
  showScreen('load');
}

function clearSignature(loadId){
  if(!confirm('Clear saved signature?')) return;
  delete dApp.signatures[loadId];
  saveData();
  showScreen('load');
  setTimeout(()=>initSigCanvas(loadId), 150);
}

function addDvirMedia(event, itemId, type){
  const file = event.target.files[0];
  if(!file){ return; }
  if(!dApp.dvirMedia) dApp.dvirMedia = {};
  if(!dApp.dvirMedia[itemId]) dApp.dvirMedia[itemId] = [];

  const reader = new FileReader();
  reader.onload = e => {
    if(type === 'photo'){
      // Compress photo
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 900;
        let w = img.width, h = img.height;
        if(w > MAX){ h = Math.round(h*MAX/w); w = MAX; }
        if(h > MAX){ w = Math.round(w*MAX/h); h = MAX; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const compressed = canvas.toDataURL('image/jpeg', 0.75);
        dApp.dvirMedia[itemId].push({
          type: 'photo',
          data: compressed,
          itemId,
          time: new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),
          date: new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'}),
        });
        saveData();
        toast('📷 Photo added to ' + (itemId==='general'?'inspection':'item'));
        showScreen('dvir');
      };
      img.src = e.target.result;
    } else {
      // Video — store as-is (already compressed by camera)
      // Limit to 30MB to avoid storage issues
      if(file.size > 30 * 1024 * 1024){
        toast('⚠ Video too large — keep under 30MB (try shorter clip)');
        return;
      }
      dApp.dvirMedia[itemId].push({
        type: 'video',
        data: e.target.result,
        itemId,
        duration: '—',
        time: new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),
        date: new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'}),
      });
      saveData();
      toast('🎥 Video recorded for ' + (itemId==='general'?'inspection':'item'));
      showScreen('dvir');
    }
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

    link.download = fileName;
    link.click();

};


// ════════════════════════════════════════════════════════════
// PUSH NOTIFICATION SYSTEM — Driver App
// Uses Web Notifications API + localStorage polling
// Works offline, no server needed
// ════════════════════════════════════════════════════════════

const NOTIF_STORAGE_KEY = 'parchies-driver-notifications';
const LOAD_NOTIF_KEY    = 'parchies-load-assignments';  // written by office app
let _notifPollInterval  = null;
let _notifHistory       = [];
let _unreadNotifs       = 0;

// ── Request notification permission ──────────────────────────
function requestNotifPermission(){
  if(!('Notification' in window)) return Promise.resolve('denied');
  if(Notification.permission === 'granted') return Promise.resolve('granted');
  if(Notification.permission === 'denied')  return Promise.resolve('denied');
  return Notification.requestPermission();
}

// ── Show an in-app banner (works without permission) ─────────
function showNotifBanner(title, message, payload={}){
  // Remove existing banner
  const existing = document.getElementById('d-notif-banner');
  if(existing) existing.remove();

  const banner = document.createElement('div');
  banner.className = 'd-notif-banner';
  banner.id = 'd-notif-banner';

  const icon = payload.type==='new-load'?'📦':
               payload.type==='status'  ?'🚛':
               payload.type==='message' ?'✉️' :'🔔';

  banner.innerHTML = `
    <div class="d-notif-icon">${icon}</div>
    <div class="d-notif-body">
      <div class="d-notif-title">${title}</div>
      <div class="d-notif-msg">${message}</div>
      ${payload.type==='new-load'?`
      <div class="d-notif-actions">
        <button class="d-notif-btn d-notif-view" onclick="viewNotifLoad('${payload.loadId}')">View Load</button>
        <button class="d-notif-btn d-notif-dismiss" onclick="dismissNotifBanner()">Dismiss</button>
      </div>`:`
      <div class="d-notif-actions">
        <button class="d-notif-btn d-notif-dismiss" onclick="dismissNotifBanner()">Dismiss</button>
      </div>`}
    </div>`;

  document.body.appendChild(banner);
  requestAnimationFrame(()=> banner.classList.add('show'));

  // Auto-dismiss after 8 seconds unless it has action buttons
  if(payload.type !== 'new-load'){
    setTimeout(()=> dismissNotifBanner(), 8000);
  }

  // Vibrate on Android
  if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
}

function dismissNotifBanner(){
  const b = document.getElementById('d-notif-banner');
  if(b){ b.classList.remove('show'); setTimeout(()=>b.remove(), 350); }
}

function viewNotifLoad(loadId){
  dismissNotifBanner();
  // Reload fresh data then navigate to load screen
  loadData();
  showScreen('load');
}

// ── Native OS push notification ───────────────────────────────
function sendNativeNotif(title, body, data={}){
  if(!('Notification' in window)) return;
  if(Notification.permission !== 'granted') return;
  try {
    const n = new Notification(title, {
      body,
      icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" fill="%230A1628" rx="32"/><text x="96" y="130" font-size="110" text-anchor="middle">🚛</text></svg>',
      badge: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72"><text y="60" font-size="60">🚛</text></svg>',
      tag: data.loadId || 'parchies-notif',
      requireInteraction: data.type === 'new-load',
      silent: false,
      data,
    });
    n.onclick = () => {
      window.focus();
      if(data.loadId) viewNotifLoad(data.loadId);
      n.close();
    };
  } catch(e){
  }
}

// ── Full notification trigger ─────────────────────────────────
function triggerNotification(title, message, payload={}){
  // Always show in-app banner
  showNotifBanner(title, message, payload);
  // Also native OS notification if permitted
  sendNativeNotif(title, message, payload);
  // Add to history
  _notifHistory.unshift({
    id: Date.now(),
    title, message, payload,
    time: new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),
    date: new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'}),
    read: false,
  });
  _unreadNotifs++;
  updateBellBadge();
  saveNotifHistory();
}

function updateBellBadge(){
  const badge = document.getElementById('d-bell-count');
  if(!badge) return;
  if(_unreadNotifs > 0){
    badge.style.display = 'flex';
    badge.textContent = _unreadNotifs > 9 ? '9+' : _unreadNotifs;
  } else {
    badge.style.display = 'none';
  }
}

function saveNotifHistory(){
  try {
    localStorage.setItem(NOTIF_STORAGE_KEY, JSON.stringify(_notifHistory.slice(0,50)));
  } catch(e){}
}

function loadNotifHistory(){
  try {
    const saved = localStorage.getItem(NOTIF_STORAGE_KEY);
    if(saved){
      _notifHistory = JSON.parse(saved);
      _unreadNotifs = _notifHistory.filter(n=>!n.read).length;
      updateBellBadge();
    }
  } catch(e){}
}

// ── Poll for new load assignments ─────────────────────────────
// Office app writes to localStorage key when assigning a load
// Driver app polls every 30s and shows notification
let _lastLoadCheck = Date.now();

function pollForNewLoads(){
  if(!dApp.driverId) return;
  try {
    const raw = localStorage.getItem(LOAD_NOTIF_KEY);
    if(!raw) return;
    const assignments = JSON.parse(raw);
    const myAssignments = (assignments[dApp.driverId]||[])
      .filter(a => a.timestamp > _lastLoadCheck && !a.seen);

    myAssignments.forEach(a => {
      // Mark as seen
      a.seen = true;
      // Show notification
      const load = DB.loads.find(l=>l.id===a.loadId) ||
                   EMBEDDED_LOADS.find(l=>l.id===a.loadId) || {};
      const origin = (load.origin||a.origin||'').split(',')[0];
      const dest   = (load.dest  ||a.dest  ||'').split(',')[0];
      const gross  = load.gross||a.gross||0;

      triggerNotification(
        '📦 New Load Assigned!',
        `Load ${a.loadId}: ${origin} → ${dest}` +
        (gross ? ` · $${gross.toLocaleString()}` : '') +
        (a.pickupDate ? ` · Pickup ${a.pickupDate}` : ''),
        { type:'new-load', loadId:a.loadId }
      );

      // Refresh DB to pick up the new load
      loadData();
      updateTopbar();
    });

    // Write back with seen flags
    if(myAssignments.length > 0){
      localStorage.setItem(LOAD_NOTIF_KEY, JSON.stringify(assignments));
      _lastLoadCheck = Date.now();
    }
  } catch(e){}
}

// ── Also check for HOS warnings ───────────────────────────────
function checkHOSAlerts(){
  if(!dApp.driverId) return;
  const hos = (DB.hos||[]).find(h=>h.driverId===dApp.driverId);
  if(!hos) return;
  const driveRemain = parseFloat(hos.driveRemaining||'11');
  if(driveRemain <= 1 && driveRemain > 0){
    // Only notify once per session
    if(!dApp._hosAlerted){
      dApp._hosAlerted = true;
      triggerNotification(
        '⚠️ HOS Warning',
        `Only ${hos.driveRemaining} drive time remaining — find a safe stop soon`,
        { type:'hos-warning' }
      );
    }
  }
}

// ── Notification history screen ───────────────────────────────
function openNotifHistory(){
  // Mark all as read
  _notifHistory.forEach(n=>n.read=true);
  _unreadNotifs = 0;
  updateBellBadge();
  saveNotifHistory();

  const existing = document.getElementById('d-notif-history-modal');
  if(existing){ existing.remove(); return; }

  const modal = document.createElement('div');
  modal.id = 'd-notif-history-modal';
  modal.style.cssText = `
    position:fixed;inset:0;background:#EAECEF;z-index:500;overflow-y:auto;
    padding:max(60px,env(safe-area-inset-top)+56px) 0 max(80px,env(safe-area-inset-bottom)+64px);
    font-family:-apple-system,Inter,sans-serif;
  `;
  modal.innerHTML = `
    <div style="background:#0A1628;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:fixed;top:0;left:0;right:0;z-index:501;padding-top:max(12px,env(safe-area-inset-top))">
      <button onclick="document.getElementById('d-notif-history-modal').remove()"
        style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;line-height:1">←</button>
      <span style="font-size:16px;font-weight:800">Notifications</span>
      ${_notifHistory.length>0?`<button onclick="clearNotifHistory()" style="margin-left:auto;background:none;border:none;color:rgba(255,255,255,.5);font-size:12px;cursor:pointer">Clear All</button>`:''}
    </div>
    <div style="padding:10px 12px">
      ${_notifHistory.length===0
        ?`<div style="text-align:center;padding:50px 20px;color:#94A3B8">
            <div style="font-size:40px;margin-bottom:10px">🔔</div>
            <div style="font-size:15px;font-weight:700">No notifications yet</div>
            <div style="font-size:12px;margin-top:6px">New load assignments will appear here</div>
          </div>`
        :_notifHistory.map(n=>`
          <div style="background:#fff;border-radius:12px;margin-bottom:8px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;gap:12px;align-items:flex-start">
            <div style="font-size:22px">${n.payload?.type==='new-load'?'📦':n.payload?.type==='hos-warning'?'⚠️':'🔔'}</div>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:700;margin-bottom:3px">${n.title}</div>
              <div style="font-size:12px;color:#64748B;line-height:1.4">${n.message}</div>
              <div style="font-size:10px;color:#94A3B8;margin-top:6px">${n.date} · ${n.time}</div>
              ${n.payload?.loadId?`<button onclick="document.getElementById('d-notif-history-modal').remove();viewNotifLoad('${n.payload.loadId}')"
                style="margin-top:8px;background:#EFF9FF;color:#0369A1;border:none;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer">View Load →</button>`:''}
            </div>
          </div>`).join('')}
    </div>`;
  document.body.appendChild(modal);
}

function clearNotifHistory(){
  _notifHistory = [];
  _unreadNotifs = 0;
  updateBellBadge();
  saveNotifHistory();
  const modal = document.getElementById('d-notif-history-modal');
  if(modal) modal.remove();
}

// ── Permission request banner ─────────────────────────────────
function showPermissionBanner(){
  if(!('Notification' in window)) return;
  if(Notification.permission !== 'default') return;
  const existing = document.getElementById('d-perm-bar');
  if(existing) return;

  const bar = document.createElement('div');
  bar.className = 'd-perm-bar';
  bar.id = 'd-perm-bar';
  bar.innerHTML = `
    <span style="font-size:22px">🔔</span>
    <div style="flex:1">
      <div style="font-size:13px;font-weight:700">Enable notifications?</div>
      <div style="font-size:11px;color:rgba(255,255,255,.6);margin-top:2px">Get alerts when new loads are assigned</div>
    </div>
    <button onclick="requestNotifPermission().then(p=>{document.getElementById('d-perm-bar')?.remove();if(p==='granted')toast('✅ Notifications enabled!')})"
      style="background:#0284C7;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0">Allow</button>
    <button onclick="document.getElementById('d-perm-bar')?.remove()"
      style="background:rgba(255,255,255,.1);color:rgba(255,255,255,.5);border:none;border-radius:8px;padding:8px;font-size:12px;cursor:pointer">✕</button>`;
  document.body.appendChild(bar);
}

// ── Init notification system ──────────────────────────────────
function initNotifications(){
  loadNotifHistory();
  // Show permission banner after 3 seconds
  setTimeout(showPermissionBanner, 3000);
  // Poll for new loads and chat replies every 30 seconds
  _notifPollInterval = setInterval(()=>{
    pollForNewLoads();
    checkHOSAlerts();
    pollForChatReplies();
  }, 30000);
  // Also check immediately
  setTimeout(pollForNewLoads, 1500);
  // Listen for BroadcastChannel messages from office app (same browser)
  if('BroadcastChannel' in window){
    const bc = new BroadcastChannel('parchies-notif');
    bc.onmessage = e => {
      const { driverId, title, message, payload } = e.data||{};
      if(driverId && driverId !== dApp.driverId) return;
      triggerNotification(title||'New Notification', message||'', payload||{});
    };
  }
}

</script>
